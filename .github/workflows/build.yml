
name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check setup script
        run: |
          ls -la
          test -f setup_elaina_menu_rapi.sh || {
            echo "ERROR: setup_elaina_menu_rapi.sh tidak ditemukan di root repository"
            exit 1
          }

      - name: Generate Android project
        run: bash setup_elaina_menu_rapi.sh

      - name: Find Gradle project
        run: |
          find . -name settings.gradle -o -name settings.gradle.kts

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Proyek Gradle tidak ditemukan setelah script dijalankan"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ELAINA-Optimasi-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
